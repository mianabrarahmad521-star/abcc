<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgGrad5)" />
  <rect x="2" y="2" width="596" height="376" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- App Window -->
  <rect x="40" y="40" width="520" height="300" rx="12" fill="#18181b" stroke="rgba(234,179,8,0.2)" stroke-width="1.5" />
  <rect x="40" y="40" width="520" height="36" rx="12" fill="#27272a" />
  <circle cx="65" cy="58" r="6" fill="#ef4444" />
  <circle cx="85" cy="58" r="6" fill="#f59e0b" />
  <circle cx="105" cy="58" r="6" fill="#10b981" />
  <text x="190" y="63" fill="#fef08a" font-family="monospace" font-size="12">Algorithm Sandbox: QuickSort &amp; MergeSort</text>

  <!-- Controls Bar -->
  <rect x="65" y="90" width="470" height="32" rx="6" fill="#27272a" />
  <rect x="75" y="95" width="70" height="22" rx="4" fill="#6366f1" />
  <text x="88" y="110" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">▶ Play</text>
  <rect x="155" y="95" width="70" height="22" rx="4" fill="#3f3f46" />
  <text x="165" y="110" fill="#e4e4e7" font-family="sans-serif" font-size="10">⏸ Pause</text>
  <rect x="235" y="95" width="80" height="22" rx="4" fill="#3f3f46" />
  <text x="245" y="110" fill="#e4e4e7" font-family="sans-serif" font-size="10">🎲 Shuffle</text>
  <text x="400" y="111" fill="#a1a1aa" font-family="monospace" font-size="11">Time: O(N log N)</text>

  <!-- Visualizer Bars -->
  <g transform="translate(65, 140)">
    <!-- Sorted bars (Green) -->
    <rect x="10" y="140" width="16" height="20" rx="3" fill="#10b981" />
    <rect x="35" y="125" width="16" height="35" rx="3" fill="#10b981" />
    <rect x="60" y="110" width="16" height="50" rx="3" fill="#10b981" />
    <rect x="85" y="95" width="16" height="65" rx="3" fill="#10b981" />

    <!-- Pivot / Comparing bars (Red / Yellow) -->
    <rect x="110" y="40" width="16" height="120" rx="3" fill="#ef4444" />
    <rect x="135" y="70" width="16" height="90" rx="3" fill="#eab308" />

    <!-- Unsorted bars (Indigo / Violet) -->
    <rect x="160" y="55" width="16" height="105" rx="3" fill="#6366f1" />
    <rect x="185" y="20" width="16" height="140" rx="3" fill="#6366f1" />
    <rect x="210" y="80" width="16" height="80" rx="3" fill="#6366f1" />
    <rect x="235" y="35" width="16" height="125" rx="3" fill="#6366f1" />
    <rect x="260" y="10" width="16" height="150" rx="3" fill="#6366f1" />
    <rect x="285" y="65" width="16" height="95" rx="3" fill="#6366f1" />
    <rect x="310" y="105" width="16" height="55" rx="3" fill="#6366f1" />
    <rect x="335" y="45" width="16" height="115" rx="3" fill="#6366f1" />
    <rect x="360" y="30" width="16" height="130" rx="3" fill="#6366f1" />
    <rect x="385" y="85" width="16" height="75" rx="3" fill="#6366f1" />
    <rect x="410" y="15" width="16" height="145" rx="3" fill="#6366f1" />
    <rect x="435" y="50" width="16" height="110" rx="3" fill="#6366f1" />

    <!-- Axis line -->
    <line x1="0" y1="165" x2="470" y2="165" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  </g>
  <text x="230" y="325" fill="#a1a1aa" font-family="monospace" font-size="11">Comparing elements at index [4] and [5]</text>
</svg>
