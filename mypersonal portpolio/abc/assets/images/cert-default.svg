<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Certificate Border Outer -->
  <rect width="600" height="420" rx="12" fill="url(#certBg)" stroke="#e2e8f0" stroke-width="4" />
  
  <!-- Fancy Double Inner Border -->
  <rect x="20" y="20" width="560" height="380" rx="8" fill="none" stroke="#4f46e5" stroke-width="2" />
  <rect x="26" y="26" width="548" height="368" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4" />

  <!-- Corner Ornaments -->
  <path d="M 30 50 L 50 30" stroke="#f59e0b" stroke-width="2" />
  <path d="M 570 50 L 550 30" stroke="#f59e0b" stroke-width="2" />
  <path d="M 30 370 L 50 390" stroke="#f59e0b" stroke-width="2" />
  <path d="M 570 370 L 550 390" stroke="#f59e0b" stroke-width="2" />

  <!-- Header -->
  <text x="300" y="75" text-anchor="middle" fill="#1e1b4b" font-family="'Times New Roman', Georgia, serif" font-size="16" letter-spacing="4" font-weight="bold">CERTIFICATE OF ACHIEVEMENT</text>
  <line x1="220" y1="88" x2="380" y2="88" stroke="#f59e0b" stroke-width="2" />

  <!-- Presentation line -->
  <text x="300" y="125" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12" letter-spacing="1">PROUDLY PRESENTED TO</text>
  
  <!-- Recipient Name -->
  <text x="300" y="175" text-anchor="middle" fill="#4338ca" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" font-style="italic">Abrar Ahmad</text>
  
  <!-- Body description -->
  <text x="300" y="215" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">For successfully completing the verified curriculum &amp; practical assessment in</text>
  
  <text x="300" y="245" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold">Web Development &amp; Software Engineering Excellence</text>

  <!-- Gold Seal -->
  <g transform="translate(110, 310)">
    <circle cx="0" cy="0" r="32" fill="url(#goldRibbon)" stroke="#b45309" stroke-width="2" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,7 -11,14 -8,3 -16,-5 -5,-5" fill="#ffffff" />
    <path d="M -12 26 L -18 48 L 0 40 L 18 48 L 12 26 Z" fill="#b45309" />
  </g>

  <!-- Signatures -->
  <g transform="translate(420, 320)">
    <!-- Signature Line -->
    <path d="M -80 0 Q -40 -20 0 -5 T 60 -15 T 80 0" fill="none" stroke="#1e1b4b" stroke-width="2" />
    <line x1="-90" y1="10" x2="90" y2="10" stroke="#94a3b8" stroke-width="1" />
    <text x="0" y="25" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">OFFICIAL VERIFIED INSTRUCTOR</text>
  </g>

  <!-- Date / Credential ID -->
  <text x="300" y="375" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">VERIFIED CREDENTIAL ID: CERT-ABRAR-2025 • ACCREDITED</text>
</svg>
